<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BombaGIS - WebGIS amatoriale del Comune di Bomba</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Plugin Leaflet.Pattern per i riempimenti a tratteggio -->
  <script src="https://unpkg.com/leaflet.pattern/dist/leaflet.pattern.js"></script>

  <script>
    // Centro mappa su Bomba (viene eseguito subito, poi sovrascritto dal fitBounds)
    const map = L.map('map').setView([42.0360, 14.3640], 14);

    // BASE 1: OpenStreetMap
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // BASE 2: OpenTopoMap
    const opentopomap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://opentopomap.org/about#verwendung">OpenTopoMap</a>'
    });
    
    // BASE 3: Esri Satellite
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    });

    // BASE 4: Ortofoto AGEA 2022 (WMS)
    const ortofoto_agea_2022 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_Ortofoto_2022_AGEA_RGB.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 2022'
    });
    
    // BASE 5: Ortofoto Regione Abruzzo 2018-2019 (WMS)
    const ortofoto_regione_abruzzo_2018_2019 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_2018_2019_Regione_Abruzzo.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; Regione Abruzzo 2018-2019'
    });

    // BASE 6: Ortofoto AGEA 2019 (WMS)
    const ortofoto_agea_2019 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_Ortofoto_2019_AGEA_RGB.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 2019'
    });

    // BASE 7: Ortofoto AGEA 2016 (WMS)
    const ortofoto_agea_2016 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_.',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 2016'
    });
    
    // BASE 8: Ortofoto AGEA 2013 (WMS)
    const ortofoto_agea_2013 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_Ortofoto2013.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 2013'
    });

    // BASE 9: Ortofoto AGEA 2010 (WMS)
    const ortofoto_agea_2010 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_italia_centrale.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 2010'
    });

    // BASE 10: Ortofoto AGEA 2009 (WMS)
    const ortofoto_agea_2009 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_Orto2009_AGEA.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 2009'
    });

    // BASE 11: Ortofoto Regione Abruzzo 2001 (WMS)
    const ortofoto_regione_abruzzo_2001 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_2001_RA.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; Regione Abruzzo 2001'
    });

    // BASE 12: Ortofoto Regione Abruzzo 2000 (WMS)
    const ortofoto_regione_abruzzo_2000 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_2000_CGR.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; Regione Abruzzo 2000'
    });

    // BASE 13: Ortofoto AGEA 1997 (WMS)
    const ortofoto_agea_1997 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_1997_AGEA.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; AGEA 1997'
    });

    // BASE 14: Ortofoto Regione Abruzzo 1982-1986 (WMS)
    const ortofoto_regione_abruzzo_1982_1986 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_RA_82-86.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'Ortofoto &copy; Regione Abruzzo 1982-1986'
    });
    
    // BASE 15: CTR 10k 2007 Regione Abruzzo (WMS)
    const ctr_10k_abruzzo_2007 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_CTR_10K_2007.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'CTR 10k &copy; Regione Abruzzo 2007'
    });
  
    // BASE 16: CTR 5k 2007 Regione Abruzzo (WMS)
    const ctr_5k_abruzzo_2007 = L.tileLayer.wms('https://geocatalogo.regione.abruzzo.it/erdas-iws/ogc/wms/', {
      layers: 'Mosaici_UTM-WGS84_CTR_5K_2007.ecw',
      format: 'image/jpeg',
      transparent: false,
      version: '1.3.0',
      attribution: 'CTR 5k &copy; Regione Abruzzo 2007'
    });
  
    // OVERLAY 1: WMS Catasto AdE - FOGLI
    const wmsCatastoFogli = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/ows01.php', {
      layers: 'CP.CadastralZoning',
      format: 'image/png',
      transparent: true,
      version: '1.1.1',         // Versione stabile anti-inversione
      crs: L.CRS.EPSG4326,      // Lingua geografica pretesa dal Catasto
      styles: ''
    });

    // OVERLAY 2: WMS Catasto AdE - PARTICELLE
    const wmsCatastoParticelle = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/ows01.php', {
      layers: 'CP.CadastralParcel',
      format: 'image/png',
      transparent: true,
      version: '1.1.1',         // Versione stabile anti-inversione
      crs: L.CRS.EPSG4326,      // Lingua geografica pretesa dal Catasto
      styles: ''
    });

    // OVERLAY 3: Mappa Storica del Regno di Napoli (XYZ)
    const xyzRegnodiNapoli = L.tileLayer('https://wmts.oldmapsonline.org/maps/3360a640-fbd7-5543-bfdd-bb4ba3be9ad9/2024-12-18T19:52:20.036Z/{z}/{x}/{y}.png?key=mwGjpOOdA6mpjAUvKB5m', {
      maxZoom: 19,
      opacity: 0.7, // 0.7 significa 70% visibile e 30% trasparente. Modificalo da 0.0 a 1.0!
      attribution: 'Cartografia Storica &copy; David Rumsey Historical Map Collection - Created by Giovanni Antonio Rizzi Zannoni and published by Giuseppe Guerra in 1808'
    });

    // Controllo Layer
    const baseMaps = {
      "OpenStreetMap": osm,
      "OpenTopoMap": opentopomap,
      "Satellite (Esri)": satellite,
      "Ortofoto AGEA (2022)": ortofoto_agea_2022,
      "Ortofoto Regione Abruzzo (2018-2019)": ortofoto_regione_abruzzo_2018_2019,
      "Ortofoto AGEA (2019)": ortofoto_agea_2019,
      "Ortofoto AGEA (2016)": ortofoto_agea_2016,
      "Ortofoto AGEA (2013)": ortofoto_agea_2013,
      "Ortofoto AGEA (2010)": ortofoto_agea_2010,
      "Ortofoto AGEA (2009)": ortofoto_agea_2009,
      "Ortofoto Regione Abruzzo (2001)": ortofoto_regione_abruzzo_2001,
      "Ortofoto Regione Abruzzo (2000)": ortofoto_regione_abruzzo_2000,
      "Ortofoto AGEA (1997)": ortofoto_agea_1997,
      "Ortofoto Regione Abruzzo (1982-1986)": ortofoto_regione_abruzzo_1982_1986,
      "CTR 10k Regione Abruzzo (2007)": ctr_10k_abruzzo_2007,
      "CTR 5k Regione Abruzzo (2007)": ctr_5k_abruzzo_2007
    };

    const overlayMaps = {
      "Catasto Fogli (WMS AdE)": wmsCatastoFogli,
      "Catasto Particelle (WMS AdE)": wmsCatastoParticelle,
      "Regno di Napoli 1808": xyzRegnodiNapoli
      
    };

    const layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    L.control.scale({ imperial: false, metric: true }).addTo(map);

    // ==========================================
    // 1. CARICAMENTO CONFINI AMMINISTRATIVI
    // ==========================================
    fetch('data/ra_limiti_amministrativi.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Errore HTTP ' + response.status);
        return response.json();
      })
      .then(geojsonData => {
        
        // COMUNE DI BOMBA (Attivo)
        const confineBomba = L.geoJSON(geojsonData, {
          filter: function(feature) {
            const nome = feature.properties && (feature.properties.nome || feature.properties.NOME);
            return nome && nome.toString().trim().toLowerCase() === 'bomba';
          },
          style: {
            color: '#000000',
            weight: 2.5,
            opacity: 1.0,
            fill: false
          }
        }).addTo(map);

        if (confineBomba.getLayers().length > 0) {
          map.fitBounds(confineBomba.getBounds());
        }

        // ALTRI COMUNI (Spento)
        const comuniConfinanti = L.geoJSON(geojsonData, {
          filter: function(feature) {
            const nome = feature.properties && (feature.properties.nome || feature.properties.NOME);
            return nome && nome.toString().trim().toLowerCase() !== 'bomba';
          },
          style: {
            color: '#666666',   
            weight: 1,          
            opacity: 0.8,
            fillColor: '#000000',
            fillOpacity: 0.05   
          }
        }); 

        layerControl.addOverlay(confineBomba, "Confine Comune di Bomba");
        layerControl.addOverlay(comuniConfinanti, "Comuni confinanti");
      })
      .catch(err => console.error("Errore caricamento GeoJSON Confini:", err));

    // ==========================================
    // 2. CARICAMENTO VINCOLO IDROGEOLOGICO
    // ==========================================
    
    // Creazione del tratteggio (Pattern)
    const vincoloPattern = new L.StripePattern({
      color: '#0cf054', // Il tuo verde
      weight: 2,        // Spessore della linea
      spaceWeight: 4,   // Spazio vuoto tra le linee
      angle: 45,        // Inclinazione in gradi
      opacity: 0.9      // Opacità delle linee
    });
    vincoloPattern.addTo(map); // Necessario per registrare il pattern sulla mappa

    fetch('data/ra_vincolo_idrogeologico.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Errore HTTP ' + response.status);
        return response.json();
      })
      .then(geojsonData => {
        
        const layerVincolo = L.geoJSON(geojsonData, {
          style: {
            color: '#0cf054',            // Bordo esterno del poligono
            weight: 1.5,                 // Spessore del bordo
            fillPattern: vincoloPattern, // Applica il tratteggio creato prima
            fillOpacity: 1.0             // Deve essere 1, l'opacità la gestisce il pattern
          }
        }); 

        // Lo aggiungiamo al menu, ma non usiamo .addTo(map) così parte disattivato
        layerControl.addOverlay(layerVincolo, "Vincolo Idrogeologico (art. 1 R.D. 3267/1923)");
      })
      .catch(err => console.error("Errore caricamento GeoJSON Vincolo:", err));

    // ==========================================
    // 3. CARICAMENTO MAPPE CATASTALI (Fogli)
    // ==========================================
    fetch('data/ade_catasto_mappe.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Errore HTTP ' + response.status);
        return response.json();
      })
      .then(geojsonData => {
        
        const layerCatastoMappe = L.geoJSON(geojsonData, {
          style: {
            color: '#e31a1c',   // Bordo rosso
            weight: 2,          // Linea marcata
            fill: false,        // Nessun riempimento per vedere sotto
            opacity: 1.0
          }
        }); 

        layerControl.addOverlay(layerCatastoMappe, "Fogli Catastali (AdE)");
      })
      .catch(err => console.error("Errore caricamento GeoJSON Fogli Catastali:", err));

    // ==========================================
    // 4. CARICAMENTO PARTICELLE CATASTALI
    // ==========================================
    fetch('data/ade_catasto_particelle.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Errore HTTP ' + response.status);
        return response.json();
      })
      .then(geojsonData => {
        
        const layerCatastoParticelle = L.geoJSON(geojsonData, {
          style: {
            color: '#ff7f00',   // Bordo arancione
            weight: 1,          // Linea sottile per le particelle
            fill: false,        // Nessun riempimento
            opacity: 0.8
          }
        }); 

        layerControl.addOverlay(layerCatastoParticelle, "Particelle Catastali (AdE)");
      })
      .catch(err => console.error("Errore caricamento GeoJSON Particelle:", err));

  </script>
</body>
</html>
